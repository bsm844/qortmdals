<!doctype html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>면접 코치 — 실전 맞춤 모의면접</title>
    <meta name="description" content="지원하는 회사나 대학교의 면접 정보를 정리해 맞춤형 모의면접과 구체적인 피드백을 제공합니다.">
    <meta property="og:title" content="면접 코치 — 실전 맞춤 모의면접">
    <meta property="og:description" content="지원하는 회사나 대학교의 면접 정보를 정리해 맞춤형 모의면접과 구체적인 피드백을 제공합니다.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-canvas: #F6F7F9;
        --bg-surface: #FFFFFF;
        --bg-inset: #F8FAFC;
        --bg-tint: #F4F7FA;
        --bg-chat: #F9FAFB;
        --text-primary: #0F172A;
        --text-secondary: #334155;
        --text-muted: #64748B;
        --text-subtle: #94A3B8;
        --border-hairline: #E2E8F0;
        --border-strong: #CBD5E1;
        --accent: #1E3A5F;
        --accent-hover: #162D4A;
        --teal: #0F766E;
        --teal-bg: #F0FDFA;
        --teal-border: #99F6E4;
        --amber: #B45309;
        --amber-bg: #FFFBEB;
        --amber-border: #FDE68A;
        --red: #B91C1C;
        --red-bg: #FEF2F2;
        --red-border: #FECACA;
        --radius-lg: 12px;
        --radius-md: 8px;
        --font-sans: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --font-mono: "JetBrains Mono", "Noto Sans KR", ui-monospace, SFMono-Regular, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3 {
        margin: 0;
        text-wrap: balance;
      }

      p {
        margin: 0;
      }

      button, input, textarea {
        font-family: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .font-mono-tabular {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Top Navigation Bar (Strict 3-zone contract) */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(246, 247, 249, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-hairline);
      }

      .header-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 24px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .brand-wordmark {
        background: none;
        border: 0;
        padding: 4px 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
      }

      .brand-wordmark:hover {
        color: var(--accent);
      }

      .header-nav {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .nav-step-btn {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 6px 2px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .nav-step-btn[data-unlocked="true"] {
        cursor: pointer;
      }

      .nav-step-btn[data-unlocked="true"]:hover {
        color: var(--text-primary);
      }

      .nav-step-btn[data-active="true"] {
        color: var(--text-primary);
        font-weight: 600;
        border-bottom-color: var(--accent);
      }

      .nav-step-btn:disabled {
        color: var(--text-subtle);
        cursor: not-allowed;
      }

      .nav-num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        margin-right: 5px;
        opacity: 0.78;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      @media (max-width: 480px) {
        .header-actions {
          gap: 6px;
        }
        .header-actions .btn-sm {
          padding: 6px 10px;
          font-size: 11px;
        }
      }

      .mobile-steps {
        display: none;
        border-top: 1px solid rgba(226, 232, 240, 0.8);
        padding: 6px 16px;
        font-size: 12px;
        gap: 12px;
        justify-content: space-between;
        overflow-x: auto;
      }

      .mobile-step-item {
        white-space: nowrap;
        flex-shrink: 0;
        color: var(--text-subtle);
      }

      .mobile-step-item[data-active="true"] {
        color: var(--accent);
        font-weight: 600;
      }

      @media (max-width: 767px) {
        .header-inner {
          padding: 0 16px;
          gap: 12px;
          height: 50px;
        }
        .header-nav {
          display: none;
        }
        .mobile-steps {
          display: flex;
        }
      }

      /* Layout Containers */
      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .main-area {
        flex: 1;
      }

      .container-narrow {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .container-wide {
        max-width: 1020px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      .page-title {
        font-size: clamp(24px, 3vw, 30px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.3;
        color: var(--text-primary);
      }

      .page-lead {
        margin-top: 10px;
        font-size: 15px;
        color: var(--text-secondary);
        max-width: 65ch;
      }

      .surface-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 24px;
      }

      @media (min-width: 640px) {
        .surface-card.p-lg {
          padding: 32px;
        }
      }

      .inset-box {
        background: var(--bg-inset);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        padding: 14px 16px;
      }

      .tint-box {
        background: var(--bg-tint);
        border: 1px solid rgba(30, 58, 95, 0.16);
        border-radius: var(--radius-md);
        padding: 16px;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
        transition: background-color 0.16s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.16s cubic-bezier(0.16, 1, 0.3, 1),
                    color 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }

      .btn-sm {
        min-height: 34px;
        padding: 6px 12px;
        font-size: 12px;
      }

      .btn-primary {
        background: var(--accent);
        color: #FFFFFF;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: #FFFFFF;
        color: var(--text-primary);
        border-color: var(--border-strong);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--bg-inset);
      }

      .btn-subtle {
        background: #F1F5F9;
        color: var(--text-secondary);
        border-color: transparent;
      }

      .btn-subtle:hover:not(:disabled) {
        background: #E2E8F0;
        color: var(--text-primary);
      }

      .btn-outline-accent {
        background: #FFFFFF;
        color: var(--accent);
        border-color: var(--accent);
      }

      .btn-outline-accent:hover:not(:disabled) {
        background: var(--bg-tint);
      }

      .btn-danger {
        background: #DC2626;
        color: #FFFFFF;
      }

      .btn-danger:hover:not(:disabled) {
        background: #B91C1C;
      }

      /* Form Inputs & Selectors */
      .field-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .field-hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .text-input,
      .text-area {
        width: 100%;
        padding: 10px 14px;
        font-size: 15px;
        color: var(--text-primary);
        background: #FFFFFF;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .text-input::placeholder,
      .text-area::placeholder {
        color: var(--text-subtle);
      }

      .text-input:focus,
      .text-area:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.14);
      }

      .text-area {
        resize: vertical;
        min-height: 82px;
      }

      .choice-card {
        text-align: left;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-hairline);
        background: var(--bg-inset);
        color: var(--text-primary);
        cursor: pointer;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      }

      .choice-card:hover {
        background: #F1F5F9;
      }

      .choice-card[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #FFFFFF;
      }

      .choice-card-title {
        font-size: 14px;
        font-weight: 600;
      }

      .choice-card-desc {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.45;
        color: var(--text-muted);
      }

      .choice-card[aria-pressed="true"] .choice-card-desc {
        color: #CBD5E1;
      }

      .focus-chip-btn {
        text-align: left;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-hairline);
        background: #FFFFFF;
        color: var(--text-primary);
        cursor: pointer;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      }

      .focus-chip-btn:hover {
        background: var(--bg-inset);
      }

      .focus-chip-btn[aria-pressed="true"] {
        background: #0F172A;
        border-color: #0F172A;
        color: #FFFFFF;
      }

      .focus-chip-btn[aria-pressed="true"] .focus-chip-sub {
        color: #CBD5E1;
      }

      .focus-chip-sub {
        margin-top: 2px;
        font-size: 11px;
        color: var(--text-muted);
      }

      /* Grids & Spacing Utilities */
      .stack-sm { display: flex; flex-direction: column; gap: 10px; }
      .stack-md { display: flex; flex-direction: column; gap: 16px; }
      .stack-lg { display: flex; flex-direction: column; gap: 24px; }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .grid-5 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      @media (min-width: 640px) {
        .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      }

      .row-between {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .row-wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      /* Status Banners */
      .status-banner {
        border-radius: var(--radius-lg);
        padding: 14px 18px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
      }

      .status-info {
        background: #F1F5F9;
        border: 1px solid var(--border-hairline);
        color: var(--text-secondary);
      }

      .status-warn {
        background: var(--amber-bg);
        border: 1px solid var(--amber-border);
        color: #78350F;
      }

      .status-error {
        background: var(--red-bg);
        border: 1px solid var(--red-border);
        color: #7F1D1D;
      }

      .status-ok {
        background: var(--teal-bg);
        border: 1px solid var(--teal-border);
        color: #134E4A;
      }

      /* Research Summary Lists */
      .section-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .question-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .question-list > li {
        padding: 12px 0;
        border-bottom: 1px solid #F1F5F9;
      }

      .question-list > li:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      /* Mock Interview Chat Shell */
      .chat-shell {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 136px);
        min-height: 520px;
        max-height: 820px;
      }

      .chat-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-hairline);
        background: #F8FAFC;
      }

      .progress-track {
        width: 100%;
        height: 6px;
        background: var(--border-hairline);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
        transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: var(--bg-chat);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .msg-row {
        display: flex;
        flex-direction: column;
      }

      .msg-row.interviewer {
        align-items: flex-start;
      }

      .msg-row.candidate {
        align-items: flex-end;
      }

      .msg-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 4px;
        padding: 0 2px;
      }

      .msg-bubble {
        max-width: min(78%, 580px);
        padding: 12px 16px;
        border-radius: var(--radius-lg);
        font-size: 15px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      @media (max-width: 639px) {
        .msg-bubble {
          max-width: 88%;
        }
      }

      .msg-bubble.interviewer {
        background: #FFFFFF;
        border: 1px solid var(--border-hairline);
        color: var(--text-primary);
      }

      .msg-bubble.candidate {
        background: var(--accent);
        color: #FFFFFF;
      }

      .msg-speech-meta {
        margin-top: 4px;
        padding: 0 2px;
        font-size: 11px;
        color: var(--text-muted);
      }

      .link-btn {
        background: none;
        border: 0;
        padding: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }

      .link-btn:hover {
        text-decoration: underline;
      }

      .chat-footer {
        padding: 14px 16px;
        border-top: 1px solid var(--border-hairline);
        background: #FFFFFF;
      }

      .stream-caret {
        display: inline-block;
        width: 6px;
        height: 16px;
        margin-left: 3px;
        vertical-align: middle;
        background: var(--accent);
        animation: blink 0.9s steps(2, start) infinite;
      }

      @keyframes blink {
        to { opacity: 0.15; }
      }

      .thinking-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .thinking-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: bounce-dot 1s infinite ease-in-out;
      }

      .thinking-dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking-dot:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
        40% { transform: translateY(-4px); opacity: 1; }
      }

      .voice-wave {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 20px;
      }

      .voice-bar {
        width: 4px;
        height: 16px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: center;
        animation: voice-wave 0.9s ease-in-out infinite;
      }

      .voice-bar:nth-child(2) { height: 20px; animation-delay: 0.15s; }
      .voice-bar:nth-child(3) { height: 14px; animation-delay: 0.3s; }
      .voice-bar:nth-child(4) { height: 20px; animation-delay: 0.45s; }
      .voice-bar:nth-child(5) { height: 16px; animation-delay: 0.6s; }

      @keyframes voice-wave {
        0%, 100% { transform: scaleY(0.32); }
        50% { transform: scaleY(1); }
      }

      /* Compact Corner Telemetry Panel */
      .metrics-hud {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 25;
        width: 252px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(6px);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
        font-size: 11px;
        color: var(--text-secondary);
      }

      @media (max-width: 1180px) {
        .metrics-hud {
          bottom: 84px;
        }
      }

      .metrics-hud-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-bottom: 1px solid #F1F5F9;
      }

      .metrics-hud-body {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .metrics-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* Score Bars */
      .score-bar-track {
        height: 8px;
        width: 100%;
        background: var(--border-hairline);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }

      .score-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-hairline);
        background: var(--bg-inset);
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .check-item[data-ok="true"] {
        background: var(--teal-bg);
        border-color: var(--teal-border);
        color: #134E4A;
      }

      /* Print Report Layout */
      #print-report {
        display: none;
      }

      @media print {
        body {
          background: #FFFFFF;
          color: #0F172A;
        }
        .site-header,
        #app-root,
        #turn-metrics-panel {
          display: none !important;
        }
        #print-report {
          display: block !important;
          padding: 12mm;
          font-size: 12px;
          line-height: 1.55;
        }
        .print-section {
          margin-bottom: 18px;
          break-inside: avoid;
        }
        .print-card {
          border: 1px solid #CBD5E1;
          border-radius: 6px;
          padding: 12px;
          margin-bottom: 10px;
          break-inside: avoid;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;

    <script>
      (function () {
        "use strict";

        /* =========================================================
         * 1. Constants & Safe Storage Utilities
         * ========================================================= */
        var CACHE_KEY = "interview_coach_research_cache_v1";
        var MAX_CACHE_ENTRIES = 20;
        var memoryFallbackStore = {};

        var LENGTH_OPTIONS = [
          { key: "short", label: "짧게", count: 5, minutes: 10, summary: "질문 5개, 약 10분" },
          { key: "medium", label: "보통", count: 8, minutes: 20, summary: "질문 8개, 약 20분" },
          { key: "long", label: "길게", count: 12, minutes: 30, summary: "질문 12개, 약 30분" },
        ];

        var FOCUSED_TYPES = [
          { type: "인성", desc: "가치관 · 지원동기 · 협업" },
          { type: "직무", desc: "전공 · 실무 역량 · 문제해결" },
          { type: "PT", desc: "주제 발표 · 논리 구조화" },
          { type: "토론", desc: "찬반 논거 · 경청과 설득" },
          { type: "압박", desc: "근거 검증 · 날카로운 반문" },
        ];

        var QUICK_EXAMPLES = [
          {
            label: "네이버 · 백엔드 개발 (종합)",
            kind: "company",
            profile: {
              organization: "네이버",
              role: "백엔드 소프트웨어 엔지니어",
              interviewMode: "comprehensive",
              focusedType: "직무",
              interviewLength: "medium",
              background:
                "컴퓨터공학 전공 신입 지원자. Spring Boot 기반 학내 커뮤니티 서비스 개발 및 트래픽 병목 개선 경험이 있습니다.",
              pastedReviews: "",
            },
          },
          {
            label: "서울대학교 · 경영학과 (종합)",
            kind: "university",
            profile: {
              organization: "서울대학교",
              role: "경영학과",
              interviewMode: "comprehensive",
              focusedType: "인성",
              interviewLength: "medium",
              background:
                "고등학교 학생회 활동 및 지역 소상공인 마케팅 봉사 동아리를 2년간 이끌었습니다.",
              pastedReviews: "",
            },
          },
        ];

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function safeStorageGet(key) {
          try {
            if (window.localStorage) {
              return window.localStorage.getItem(key);
            }
          } catch (e) {
            // file:// private mode fallback
          }
          return Object.prototype.hasOwnProperty.call(memoryFallbackStore, key)
            ? memoryFallbackStore[key]
            : null;
        }

        function safeStorageSet(key, val) {
          memoryFallbackStore[key] = val;
          try {
            if (window.localStorage) {
              window.localStorage.setItem(key, val);
            }
          } catch (e) {
            // ignore quota/file security errors
          }
        }

        function getLengthCount(lenKey) {
          for (var i = 0; i < LENGTH_OPTIONS.length; i++) {
            if (LENGTH_OPTIONS[i].key === lenKey) return LENGTH_OPTIONS[i].count;
          }
          return 8;
        }

        function formatElapsed(sec) {
          var m = Math.floor(sec / 60);
          var s = sec % 60;
          return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        function formatTimeNow() {
          try {
            return new Date().toLocaleTimeString("ko-KR", {
              hour: "2-digit",
              minute: "2-digit",
            });
          } catch (e) {
            return "";
          }
        }

        function formatCachedDate(iso) {
          if (!iso) return "";
          var d = new Date(iso);
          if (isNaN(d.getTime())) return "";
          return (
            d.getMonth() +
            1 +
            "/" +
            d.getDate() +
            " " +
            String(d.getHours()).padStart(2, "0") +
            ":" +
            String(d.getMinutes()).padStart(2, "0")
          );
        }

        /* =========================================================
         * 2. Research Cache (localStorage)
         * ========================================================= */
        function buildCacheKey(org, role) {
          var nOrg = String(org || "").trim().replace(/\s+/g, " ").toLowerCase();
          var nRole = String(role || "").trim().replace(/\s+/g, " ").toLowerCase();
          return nOrg + "::" + nRole;
        }

        function readCacheStore() {
          try {
            var raw = safeStorageGet(CACHE_KEY);
            if (!raw) return {};
            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
            return parsed;
          } catch (e) {
            return {};
          }
        }

        function getCachedResearch(org, role, pastedReviews) {
          var key = buildCacheKey(org, role);
          if (!key || key === "::") return null;
          var store = readCacheStore();
          var entry = store[key];
          if (!entry || !entry.research) return null;
          if (String(entry.pastedReviews || "") !== String(pastedReviews || "").trim()) {
            return null;
          }
          return entry;
        }

        function saveCachedResearch(org, role, research, pastedReviews) {
          var key = buildCacheKey(org, role);
          var entry = {
            key: key,
            organization: String(org || "").trim(),
            role: String(role || "").trim(),
            pastedReviews: String(pastedReviews || "").trim(),
            cachedAt: new Date().toISOString(),
            research: research,
          };
          if (key && key !== "::") {
            var store = readCacheStore();
            store[key] = entry;
            var entries = Object.keys(store)
              .map(function (k) { return store[k]; })
              .sort(function (a, b) { return a.cachedAt < b.cachedAt ? 1 : -1; })
              .slice(0, MAX_CACHE_ENTRIES);
            var trimmed = {};
            for (var i = 0; i < entries.length; i++) {
              trimmed[entries[i].key] = entries[i];
            }
            safeStorageSet(CACHE_KEY, JSON.stringify(trimmed));
          }
          return entry;
        }

        /* =========================================================
         * 3. Inline Crisp SVG Icons (Affordances Only)
         * ========================================================= */
        function iconSvg(name, cls) {
          var c = cls || "icon-sm";
          var paths = {
            search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
            arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
            arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
            building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>',
            grad: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/>',
            check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
            minus: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
            refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
            mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
            micOff: '<line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/>',
            square: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
            send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
            volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
            volumeOff: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>',
            clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
            alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12" y1="16" y2="16.01"/>',
            list: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
            msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
            bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
            chevDown: '<path d="m6 9 6 6 6-6"/>',
            chevUp: '<path d="m18 15-6-6-6 6"/>',
            db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
          };
          return (
            '<svg class="' +
            c +
            '" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (paths[name] || "") +
            "</svg>"
          );
        }

        /* =========================================================
         * 4. Domain Intelligence, Research Summary & Question Planner
         * ========================================================= */
        function detectDomain(org, role, background, pastedReviews) {
          var combined = (org + " " + role + " " + background + " " + pastedReviews).toLowerCase();
          var isUniversity =
            /대학|학과|학부|입시|학생부|생기부|세특|수시|학종|고교|고등학교/.test(combined);
          var isTech =
            /개발|엔지니어|백엔드|프론트|소프트웨어|데이터|ai|인공지능|컴퓨터|전기|전자|기계|화학|공학|보안|시스템|클라우드/.test(
              combined
            );
          var isBiz =
            /경영|기획|마케팅|영업|전략|pm|po|브랜드|금융|회계|경제|인사|hr|컨설팅/.test(combined);
          var isDesign = /디자인|ux|ui|콘텐츠|미디어|영상|홍보/.test(combined);
          return {
            isUniversity: isUniversity,
            isTech: isTech,
            isBiz: isBiz,
            isDesign: isDesign,
          };
        }

        function extractBackgroundTopics(background) {
          if (!background || !background.trim()) return [];
          var parts = background
            .split(/[,.\n;/]+/)
            .map(function (s) { return s.trim(); })
            .filter(function (s) { return s.length >= 4 && s.length <= 55; });
          return parts.slice(0, 4);
        }

        function extractPastedQuestions(pastedText) {
          if (!pastedText || !pastedText.trim()) return [];
          var lines = pastedText
            .split(/\r?\n|[?!]/)
            .map(function (s) {
              return s
                .replace(/^\s*(?:Q\s*\d*|\d+)[.)\s:-]*/i, "")
                .replace(/^기출\s*질문\s*[:：]\s*/i, "")
                .trim();
            })
            .filter(function (s) { return s.length >= 8; });

          var results = [];
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (
              /\?|인가요|습니까|있나요|말씀해|설명해|이유는|무엇|어떻게|왜\s/.test(line) ||
              line.indexOf("질문") !== -1
            ) {
              var qText = /[?？.]$/.test(line) ? line : line + "?";
              if (qText.length > 90) {
                qText = qText.slice(0, 86).trim() + "?";
              }
              results.push(qText);
            }
            if (results.length >= 4) break;
          }
          return results;
        }

        function generateResearchSummary(profile, variationIndex) {
          var org = profile.organization.trim();
          var role = profile.role.trim();
          var bg = (profile.background || "").trim();
          var pasted = (profile.pastedReviews || "").trim();
          var hasPasted = pasted.length > 0;
          var domain = detectDomain(org, role, bg, pasted);
          var bgTopics = extractBackgroundTopics(bg);
          var v = variationIndex || 0;

          // Detect atmosphere & rounds from pasted reviews if provided
          var pressureLevel = "보통";
          if (hasPasted && /압박|날카|꼬리질문.*길|15분|집요|까다롭/.test(pasted)) {
            pressureLevel = "날카로움";
          } else if (hasPasted && /편안|차분|친절|부드럽|대화형/.test(pasted)) {
            pressureLevel = "차분함";
          } else if (profile.interviewMode === "focused" && profile.focusedType === "압박") {
            pressureLevel = "날카로움";
          }

          var interviewerTone =
            pressureLevel === "날카로움"
              ? "답변의 구체적 근거와 사실 여부를 끝까지 파고드는 날카로운 존댓말 면접관"
              : pressureLevel === "차분함"
              ? "지원자의 긴장을 풀어주되 핵심 경험의 맥락을 차분히 확인하는 존댓말 면접관"
              : "차분하고 정중한 어조로 실제 경험과 논리 근거를 확인하는 면접관";

          var rounds = [];
          if (hasPasted) {
            if (/1차|실무|직무/.test(pasted)) {
              rounds.push({
                id: "round-1",
                name: "1차 직무·실무 면접",
                description: "붙여넣은 후기에 언급된 직무 역량과 프로젝트 트러블슈팅 중심 검증",
              });
            }
            if (/2차|임원|인성|최종/.test(pasted)) {
              rounds.push({
                id: "round-2",
                name: "2차 임원·인성 면접",
                description: "조직 적합성, 가치관, 지원 동기의 진정성을 확인하는 단계",
              });
            }
            if (/PT|발표/.test(pasted)) {
              rounds.push({
                id: "round-pt",
                name: "PT 발표 면접",
                description: "주어진 과제를 제한 시간 내 구조화하여 발표하고 질의응답을 진행",
              });
            }
          }

          var threeLineSummary = domain.isUniversity
            ? [
                org + " " + role + "는 지원자의 전공 관심 계기와 탐구 과정의 일관성을 중요하게 봅니다.",
                "학생부·활동 내용에서 본인이 직접 주도한 역할과 배운 점을 논리적으로 설명하는 역량이 핵심입니다.",
                "세부 학과 프로그램·연구실 정보는 단정하지 않고, 교과 기초와 탐구 태도 중심으로 대비합니다.",
              ]
            : domain.isTech
            ? [
                org + "의 " + role + " 포지션은 문제 정의부터 해결·검증까지의 실무 사고 과정을 중시합니다.",
                "단순 기술 나열보다 왜 그 기술을 선택했고 어떤 지표를 개선했는지 근거 중심 설명이 요구됩니다.",
                "협업 과정에서 발생한 갈등이나 장애를 어떻게 조율하고 재발 방지했는지가 주요 평가 포인트입니다.",
              ]
            : [
                org + "의 " + role + " 직무는 목표 달성을 위한 실행력과 팀 협업 경험을 핵심으로 봅니다.",
                "지원 동기와 본인의 경험이 해당 직무의 실제 과제와 어떻게 맞닿아 있는지 연결해 설명해야 합니다.",
                "모호한 표현보다 구체적인 수치·행동·결과를 제시할 때 높은 신뢰도를 얻을 수 있습니다.",
              ];

          var institutionContext = {
            threeLineSummary: threeLineSummary,
            businessDomain: domain.isUniversity
              ? org + " " + role + "의 기초 학문 탐구 및 전공 연계 응용 역량을 기르는 교육 과정"
              : org + "에서 " + role + " 역량을 바탕으로 서비스·사업 경쟁력을 높이는 직무 영역",
            coreValues: domain.isUniversity
              ? "학업 성실성, 자기주도적 탐구 태도, 전공에 대한 지속적 호기심과 공동체 기여"
              : "주도적 문제 해결력, 데이터·근거 기반 의사결정, 동료와 원활히 소통하는 협업 태도",
            flagshipProductsOrCurriculum: domain.isTech
              ? "전공·실무 기초 원리 이해, 시스템 설계 및 트러블슈팅, 품질 개선 경험"
              : domain.isBiz
              ? "문제 구조화, 실행 전략 수립, 성과 분석 및 이해관계자 커뮤니케이션"
              : "전공 핵심 개념의 실제 적용, 탐구 프로젝트 설계 및 결과 해석 역량",
            industryIssues:
              "AI·디지털 전환 흐름 속에서 기본기 탄탄한 인재와 실제 문제 해결 경험에 대한 검증이 강화되는 추세입니다.",
            modelKnowledgeNotice: "모델 지식 기반이라 최신 정보와 다를 수 있어요",
          };

          var questionItems = [];
          var pastedQs = extractPastedQuestions(pasted);
          for (var pIdx = 0; pIdx < pastedQs.length; pIdx++) {
            questionItems.push({
              question: pastedQs[pIdx],
              isRealQuestion: true,
              questionBasis: "후기 기반",
              questionTag: "기관·직무 특화",
              note: "붙여넣은 면접 후기·기출에서 직접 추출한 질문입니다.",
              yearInfo: "사용자 붙여넣기 후기",
            });
          }

          // Background-tailored question
          if (bgTopics.length > 0 && questionItems.length < 5) {
            var topic = bgTopics[v % bgTopics.length];
            questionItems.push({
              question: domain.isUniversity
                ? "학생부나 활동 중 '" + topic + "' 경험에서 가장 깊이 고민했던 점은 무엇인가요?"
                : "이력에 적으신 '" + topic + "' 경험에서 본인이 직접 해결한 가장 까다로운 문제는 무엇이었나요?",
              isRealQuestion: false,
              questionBasis: "모델 지식 기반",
              questionTag: "기관·직무 특화",
              note: "입력하신 경력·활동 정보를 우선 반영해 만든 맞춤 질문입니다.",
            });
          }

          var poolTech = [
            role + "에서 장애나 성능 저하가 발생했을 때 가장 먼저 원인을 좁혀가는 기준은 무엇인가요?",
            "최근 진행한 프로젝트에서 기술적 선택을 두고 고민했던 사례와 최종 결정 이유를 말씀해 주세요.",
            "협업 과정에서 코드 품질이나 설계 방향을 두고 의견이 달랐을 때 어떻게 조율하셨나요?",
            "트래픽이나 데이터 규모가 지금보다 10배 커진다면 기존 설계에서 어디를 먼저 보완하시겠어요?",
          ];

          var poolUniv = [
            org + " " + role + "에 지원하게 된 결정적인 계기가 무엇인가요?",
            "고등학교 과정에서 가장 흥미를 느끼고 스스로 확장해 탐구했던 주제는 무엇인가요?",
            "전공 공부를 하면서 예상과 달라 어려웠던 개념이나 과제를 어떻게 극복하셨나요?",
            "팀 활동이나 동아리에서 의견 충돌이 생겼을 때 본인은 어떤 방식으로 조율하는 편인가요?",
          ];

          var poolBiz = [
            org + "의 " + role + "에 지원하신 이유와 본인이 기여할 수 있는 강점은 무엇인가요?",
            "목표나 일정이 촉박한 상황에서 우선순위를 정해 문제를 해결했던 경험을 말씀해 주세요.",
            "예상과 다른 결과가 나왔을 때 원인을 분석하고 계획을 수정했던 사례가 있나요?",
            "함께 일하기 까다로웠던 동료나 이해관계자와 협업을 이끌어낸 경험이 있다면 들려주세요.",
          ];

          var chosenPool = domain.isUniversity
            ? poolUniv
            : domain.isTech
            ? poolTech
            : poolBiz;

          for (var k = 0; k < chosenPool.length && questionItems.length < 4; k++) {
            var qCandidate = chosenPool[(k + v) % chosenPool.length];
            var exists = questionItems.some(function (it) { return it.question === qCandidate; });
            if (!exists) {
              questionItems.push({
                question: qCandidate,
                isRealQuestion: false,
                questionBasis: "모델 지식 기반",
                questionTag: k % 2 === 0 ? "기관·직무 특화" : "실무 상황 가정",
                note: org + " · " + role + " 맥락과 지원자 정보 기준으로 구성한 질문입니다.",
              });
            }
          }

          var genericPool = [
            "본인의 강점이 입사 후 또는 입학 후 어떤 상황에서 가장 빛을 발할 수 있을까요?",
            "지금까지 겪은 가장 큰 실패 경험과 그 과정에서 배운 점을 한 가지 말씀해 주세요.",
          ];
          questionItems.push({
            question: genericPool[v % genericPool.length],
            isRealQuestion: false,
            questionBasis: "일반 예상 질문",
            questionTag: "범용 질문",
            note: "지원 동기와 태도를 확인하는 기본 질문입니다.",
          });

          return {
            organization: org,
            role: role,
            interviewMode: profile.interviewMode,
            focusedType: profile.focusedType,
            dataStatus: hasPasted ? "limited" : "unsearched",
            isWithoutSearch: !hasPasted,
            hasPastedReviews: hasPasted,
            dataStatusMessage: hasPasted
              ? "붙여넣은 면접 후기·기출을 최우선 근거로 반영했습니다. 후기에 없는 항목은 모델 지식 기반 요약입니다."
              : "검색 없이 로컬 모델 지식 기반으로 구성한 요약입니다. 실제 최신 전형과 다를 수 있어요.",
            institutionContext: institutionContext,
            interviewRounds: rounds,
            processCard: {
              summary: hasPasted
                ? "붙여넣은 후기·기출을 최우선으로 반영해 면접 흐름과 검증 포인트를 정리했습니다."
                : "실제 실전 면접 흐름(자기소개 → 지원 동기 → 경험·역량 → 직무·전공 → 상황 질문 → 마무리)으로 진행됩니다.",
              stages: [
                hasPasted
                  ? "붙여넣은 후기 기반 질문 + 직무·경험 검증 및 꼬리질문"
                  : "자기소개 → 지원 동기 → 경험·역량 → 직무/전공 → 상황 질문 → 마무리",
              ],
            },
            questionsCard: {
              items: questionItems.slice(0, 5),
            },
            atmosphereCard: {
              summary: hasPasted
                ? "붙여넣은 후기에 나타난 분위기와 압박 수준을 반영했습니다."
                : "지원자의 논리 전개와 구체적 경험 근거를 차분히 확인하는 실전 면접 분위기입니다.",
              interviewerTone: interviewerTone,
              pressureLevel: pressureLevel,
            },
            tipsCard: {
              tips: [
                "두괄식으로 핵심 결론을 첫 문장에 먼저 제시한 뒤, 실제 행동과 수치·결과를 덧붙여 보세요.",
                org + " " + role + "에 지원한 이유를 본인의 구체적인 경험 1가지와 자연스럽게 연결하세요.",
                "꼬리질문이 이어질 때를 대비해 '왜 그 방식을 선택했는지' 판단 근거를 1~2문장으로 정리해 두세요.",
              ],
            },
            allSources: [],
          };
        }

        /* =========================================================
         * 5. Real Interview Flow Question Planner (5 / 8 / 12)
         * ========================================================= */
        function getStageInfo(qNum, totalQuestions) {
          if (qNum <= 1) {
            return { stageName: "자기소개", difficulty: "가벼운 시작" };
          }
          if (qNum === 2) {
            return { stageName: "지원 동기", difficulty: "기본" };
          }
          if (qNum >= totalQuestions) {
            return { stageName: "하고 싶은 말·궁금한 점", difficulty: "마무리" };
          }
          if (totalQuestions <= 5) {
            return qNum === 3
              ? { stageName: "경험·역량", difficulty: "중간" }
              : { stageName: "직무·전공 및 상황 질문", difficulty: "심화" };
          }
          if (totalQuestions <= 8) {
            if (qNum <= 4) return { stageName: "경험·역량", difficulty: "중간" };
            if (qNum <= 6) return { stageName: "직무·전공", difficulty: "심화" };
            return { stageName: "상황 질문", difficulty: "실전 응용" };
          }
          if (qNum <= 5) return { stageName: "경험·역량", difficulty: "중간" };
          if (qNum <= 8) return { stageName: "직무·전공", difficulty: "심화" };
          return { stageName: "상황 질문", difficulty: "실전 응용" };
        }

        function buildPlannedQuestions(profile, research, mode, focusedType, selectedRound, totalQuestions) {
          var org = profile.organization.trim();
          var role = profile.role.trim();
          var domain = detectDomain(org, role, profile.background || "", profile.pastedReviews || "");
          var bgTopics = extractBackgroundTopics(profile.background || "");

          var reviewItems = (research.questionsCard && research.questionsCard.items ? research.questionsCard.items : [])
            .filter(function (q) { return q.questionBasis === "후기 기반" || q.isRealQuestion; });
          var knowledgeItems = (research.questionsCard && research.questionsCard.items ? research.questionsCard.items : [])
            .filter(function (q) { return q.questionBasis !== "후기 기반" && !q.isRealQuestion; });

          var expBank = [];
          if (bgTopics.length > 0) {
            expBank.push(
              domain.isUniversity
                ? "학생부나 활동에 적으신 '" + bgTopics[0] + "' 경험에서 가장 주도적으로 했던 일은 무엇인가요?"
                : "경력란에 적어주신 '" + bgTopics[0] + "'에서 본인이 직접 해결한 문제는 무엇이었나요?"
            );
          }
          if (bgTopics.length > 1) {
            expBank.push("'" + bgTopics[1] + "' 활동을 진행하면서 가장 아쉬웠던 점이나 배운 점은 무엇인가요?");
          }
          expBank.push(
            "팀 활동이나 협업 중 의견이 갈렸을 때 본인이 직접 조율해 해결했던 경험을 말씀해 주세요.",
            "예상치 못한 문제로 목표 달성이 어려웠을 때 끝까지 해결했던 사례 한 가지를 들려주세요.",
            "본인이 했던 프로젝트나 활동 중 가장 자신 있게 설명할 수 있는 성과는 무엇인가요?"
          );

          var majorBank = domain.isUniversity
            ? [
                role + "와 관련해 최근 관심 있게 탐구한 주제나 개념 한 가지를 설명해 주시겠어요?",
                "전공 공부를 할 때 가장 중요하다고 생각하는 기본 역량은 무엇이라고 보시나요?",
                role + " 분야에서 앞으로 해결해보고 싶은 학업적 과제가 있다면 무엇인가요?",
              ]
            : domain.isTech
            ? [
                role + " 업무에서 시스템 안정성과 성능을 동시에 높이기 위해 가장 먼저 확인하는 기준은 무엇인가요?",
                "서비스 장애나 예기치 않은 오류가 발생했을 때 원인을 파악하고 복구하는 본인만의 순서가 있나요?",
                "코드나 설계의 완성도와 빠른 일정 사이에서 균형을 맞춰야 한다면 어떤 기준으로 판단하시겠어요?",
              ]
            : [
                role + " 직무를 수행할 때 가장 핵심이 되는 역량 한 가지와 그 이유를 말씀해 주세요.",
                "데이터나 근거를 바탕으로 기존 방식을 개선하거나 설득했던 기준은 무엇인가요?",
                role + " 분야에서 본인이 다른 지원자와 차별화할 수 있는 강점은 무엇이라고 생각하나요?",
              ];

          var situationBank = [
            "마감 기한이 임박했는데 완성도가 기대에 못 미치는 상황이라면 어떻게 대처하시겠어요?",
            "동료나 선배의 판단이 비효율적으로 보일 때 본인 의견을 어떻게 전달하시겠어요?",
            "입사(입학) 후 전혀 경험해보지 못한 낯선 과제를 맡게 된다면 첫 일주일을 어떻게 보내시겠어요?",
          ];

          if (mode === "focused") {
            if (focusedType === "압박") {
              situationBank.unshift("본인의 답변에 근거가 부족하다는 지적을 받는다면 어떻게 바로 보완해 설명하시겠어요?");
            } else if (focusedType === "PT") {
              majorBank.unshift(role + " 분야의 핵심 문제 하나를 30초 안에 결론부터 구조화해 발표해 보시겠어요?");
            } else if (focusedType === "토론") {
              situationBank.unshift("팀 내 다수 의견과 본인의 결론이 정반대일 때 어떻게 상대를 설득하시겠어요?");
            }
          }

          var reviewIdx = 0;
          var knowledgeIdx = 0;
          var expIdx = 0;
          var majorIdx = 0;
          var sitIdx = 0;

          var plan = [];
          for (var i = 0; i < totalQuestions; i++) {
            var qNum = i + 1;
            var stage = getStageInfo(qNum, totalQuestions);
            var question = "";
            var basis = "모델 지식 기반";

            if (qNum === 1) {
              question = "안녕하세요. 편하게 1분 정도 자기소개부터 해주시겠어요?";
            } else if (qNum === 2) {
              question = "왜 " + org + " " + role + "에 지원하셨나요?";
            } else if (qNum >= totalQuestions) {
              question = "마지막으로 꼭 하고 싶은 말씀이나 궁금한 점이 있으신가요?";
            } else if (stage.stageName === "경험·역량") {
              if (reviewIdx < reviewItems.length && expIdx > 0) {
                question = reviewItems[reviewIdx++].question;
                basis = "후기 기반";
              } else {
                question = expBank[expIdx++ % expBank.length];
              }
            } else if (stage.stageName.indexOf("직무·전공") !== -1) {
              if (reviewIdx < reviewItems.length) {
                question = reviewItems[reviewIdx++].question;
                basis = "후기 기반";
              } else if (knowledgeIdx < knowledgeItems.length && majorIdx === 0) {
                question = knowledgeItems[knowledgeIdx++].question;
                majorIdx++;
              } else {
                question = majorBank[majorIdx++ % majorBank.length];
              }
            } else {
              if (reviewIdx < reviewItems.length) {
                question = reviewItems[reviewIdx++].question;
                basis = "후기 기반";
              } else {
                question = situationBank[sitIdx++ % situationBank.length];
              }
            }

            plan.push({
              questionNumber: qNum,
              stageName: stage.stageName,
              question: question,
              questionBasis: basis,
            });
          }
          return plan;
        }

        /* =========================================================
         * 6. Answer Relevance Judgment & Targeted Follow-up Engine
         * ========================================================= */
        function isPersonalBackgroundOffTopic(text) {
          return /(아버지|어머니|부모님|엄마|아빠|형제|자매|집안|재산|금수저|출신\s*지역|고향|부산|대구|광주|대전|인천|제주|강남|평수|아파트|공무원|교수|의사|사업가)[^\n]{0,20}(이시고|이십니다|입니다|살았|자랐|출신|직업|돈|자산)/.test(
            text
          ) || /(아버지|어머니|부모님)\s*(직업|회사|일|가정|집안)/.test(text);
        }

        function hasConcreteEvidence(text) {
          var clean = text.replace(/\s+/g, " ").trim();
          var hasNumberOrMetric = /\d+|%|배|건|명|초|분|시간|주|개월|년|원|점/.test(clean);
          var hasActionResult =
            /(제안|구축|도입|해결|개선|분석|설계|조율|정리|테스트|검증|발표|적용|줄여|높여|단축|달성|완료|결과적으로)/.test(
              clean
            );
          var hasStructureCue = /(예를 들어|구체적으로|첫째|둘째|당시|때문에|결과|이를 통해)/.test(
            clean
          );
          return (
            clean.length >= 75 &&
            ((hasNumberOrMetric && hasActionResult) || (hasActionResult && hasStructureCue && clean.length >= 105))
          );
        }

        function extractCoreIntentLabel(mainQuestion) {
          if (/자기소개/.test(mainQuestion)) return "본인의 핵심 강점과 지원 직무와의 연결점";
          if (/지원|동기|이유/.test(mainQuestion)) return "지원 동기와 본인이 기여할 수 있는 점";
          if (/갈등|협업|조율/.test(mainQuestion)) return "협업 갈등 상황에서 본인이 취한 해결 행동";
          if (/장애|오류|성능|기준|전공|개념/.test(mainQuestion)) return "직무·전공 관련 구체적 해결 기준이나 원리";
          if (/대처|상황|설득|마감|낯선/.test(mainQuestion)) return "해당 상황에서의 판단 기준과 행동 계획";
          return "질문과 직접 연결된 본인의 경험과 역량";
        }

        function extractCandidateFocusTerm(answerText) {
          var stopWords = /^(저는|제가|그냥|정말|매우|아주|그리고|하지만|그래서|팀에서|프로젝트|활동에서|경험이|있었습니다|했습니다|합니다|입니다|같습니다|때문입니다)$/;
          var words = answerText
            .replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s]/g, " ")
            .split(/\s+/)
            .map(function (w) { return w.trim(); })
            .filter(function (w) { return w.length >= 2 && w.length <= 14 && !stopWords.test(w); });

          // Prefer domain/action terms
          var preferred = words.filter(function (w) {
            return /(갈등|조율|대화|소통|성능|최적화|개선|개발|설계|분석|리더|팀장|협업|데이터|테스트|배포|연구|탐구|동아리|봉사|발표|설득|마감|우선순위|오류|장애)/.test(
              w
            );
          });
          var chosen = preferred.length > 0 ? preferred[0] : words[0];
          return chosen || "";
        }

        function evaluateCandidateTurn(params) {
          var answer = (params.answer || "").trim();
          var mainQuestion = params.mainQuestion || "";
          var lastQuestion = params.lastQuestion || mainQuestion;
          var followUpCount = params.followUpCount || 0;
          var offTopicCount = params.offTopicCount || 0;
          var isPressure = params.interviewMode === "focused" && params.focusedType === "압박";

          var compact = answer.replace(/\s+/g, "");
          var isPassOrIdk = /^(모르겠|잘 모르|패스|pass|글쎄요|없습니다|생각이 안|답변하기 어렵)/i.test(
            answer
          );
          var isTooShortNoise = compact.length < 6 || /^([ㅋㅎㅠㅜ?!.\-])+$/.test(compact);
          var isUnrelatedFoodWeather =
            /(점심|저녁|메뉴|김치찌개|날씨|비\s*가|취미|게임|유튜브|잠을)/.test(answer) &&
            !/(프로젝트|서비스|개발|분석|마케팅|고객|사용자|업무|활동)/.test(answer);
          var isPersonalOffTopic = isPersonalBackgroundOffTopic(answer);

          var relevance = "정상";
          var needsFollowUp = false;

          if (isPassOrIdk || isTooShortNoise || isUnrelatedFoodWeather || isPersonalOffTopic) {
            relevance = "무관";
          } else {
            // Check overlap with question intent
            var mentionsFamilyPlusSomeContent =
              /(부모|아버지|어머니|고향|출신)/.test(answer) && compact.length < 45;
            if (mentionsFamilyPlusSomeContent) {
              relevance = "부분적으로 관련";
              needsFollowUp = true;
            } else {
              var concrete = hasConcreteEvidence(answer);
              if (concrete) {
                relevance = "정상";
                needsFollowUp = isPressure && followUpCount === 0 && !/\d/.test(answer);
              } else {
                relevance = "정상";
                needsFollowUp = followUpCount < 2;
              }
            }
          }

          var action = "followup";
          if (relevance === "무관") {
            action = offTopicCount >= 1 ? "skip_next_question" : "reask";
          } else if (relevance === "정상" && (!needsFollowUp || followUpCount >= 2)) {
            action = "next_question";
          } else if (relevance === "부분적으로 관련" && followUpCount >= 2) {
            action = "next_question";
          }

          var message = "";
          if (action === "reask") {
            var coreIntent = extractCoreIntentLabel(mainQuestion || lastQuestion);
            message =
              "제가 여쭌 건 " +
              coreIntent +
              "입니다. 경험이나 역량 중심으로 다시 말씀해 주시겠어요?";
          } else if (action === "followup") {
            var keyword = extractCandidateFocusTerm(answer);
            if (relevance === "부분적으로 관련") {
              message = "질문의 핵심에 맞춰 본인이 직접 실행한 행동과 결과를 말씀해 주시겠어요?";
            } else if (keyword) {
              if (followUpCount === 0) {
                message =
                  "방금 '" +
                  keyword +
                  "'을 말씀하셨는데, 본인이 직접 한 행동과 구체적 결과는 어땠나요?";
              } else {
                message =
                  "'" +
                  keyword +
                  "' 과정에서 다른 대안 대신 그 방식을 택한 가장 큰 이유는 무엇인가요?";
              }
            } else if (followUpCount === 0) {
              message = "말씀하신 경험에서 본인이 직접 맡은 역할과 구체적 수치를 알려주시겠어요?";
            } else {
              message = "그 선택을 내린 가장 핵심적인 근거 한 가지만 더 말씀해 주시겠어요?";
            }
          }

          // Enforce <= 80 chars concise spoken rule
          if (message.length > 80) {
            message = message.slice(0, 77).trim() + "?";
          }

          return {
            relevance: relevance,
            action: action,
            message: message,
          };
        }

        function evaluateClosingTurn(answer) {
          var trimmed = (answer || "").trim();
          var askedQuestion =
            /[?？]|궁금|여쭤|알고\s*싶|질문/.test(trimmed) &&
            !/^(없습니다|없어요|별도로 없습니다|괜찮습니다|감사합니다)[.!]?$/.test(trimmed);

          if (!askedQuestion) {
            return {
              needsStream: false,
              message: "좋은 말씀 감사합니다. 오늘 면접은 여기서 마치겠습니다. 수고 많으셨습니다.",
            };
          }
          return {
            needsStream: true,
            message: "좋은 질문 감사합니다. 합류 후 팀 온보딩 과정에서 자세히 안내드리겠습니다. 오늘 수고 많으셨습니다.",
          };
        }

        /* =========================================================
         * 7. Speech Metrics & Feedback Report Generator
         * ========================================================= */
        function countFillers(text) {
          if (!text || !text.trim()) {
            return { fillerCounts: { 음: 0, 어: 0, 그니까: 0, 약간: 0 }, totalFillers: 0 };
          }
          var um = text.match(/(?:^|[\s,.!?~…"'()])(음+|으음)(?=$|[\s,.!?~…"'()])/g);
          var eo = text.match(/(?:^|[\s,.!?~…"'()])(어+|어어)(?=$|[\s,.!?~…"'()])/g);
          var geu = text.match(/(?:^|[\s,.!?~…"'()])(그니까요?|그러니까요?)(?=$|[\s,.!?~…"'()])/g);
          var yak = text.match(/(?:^|[\s,.!?~…"'()])약간(?=$|[\s,.!?~…"'()])/g);
          var counts = {
            음: um ? um.length : 0,
            어: eo ? eo.length : 0,
            그니까: geu ? geu.length : 0,
            약간: yak ? yak.length : 0,
          };
          return {
            fillerCounts: counts,
            totalFillers: counts.음 + counts.어 + counts.그니까 + counts.약간,
          };
        }

        function calcSpeechMetrics(finalText, rawSpoken, voiceMs, turnMs) {
          var usedVoice = voiceMs >= 1000;
          var durationSec = Math.max(1, Math.round((usedVoice ? voiceMs : turnMs) / 1000));
          var charCount = finalText.replace(/\s+/g, "").length;
          var charsPerMin = Math.round((charCount / durationSec) * 60);
          var scanText = usedVoice && rawSpoken && rawSpoken.trim() ? rawSpoken : finalText;
          var fillers = countFillers(scanText);
          return {
            durationSec: durationSec,
            charCount: charCount,
            charsPerMin: charsPerMin,
            usedVoice: usedVoice,
            fillerCounts: fillers.fillerCounts,
            totalFillers: fillers.totalFillers,
          };
        }

        function getSpeedAssessment(cpm, hasVoice) {
          if (!hasVoice) return "텍스트 입력 기준";
          if (cpm < 220) return "조금 느린 편 (권장 250~360자/분)";
          if (cpm <= 380) return "안정적인 적정 속도 (권장 250~360자/분)";
          return "조금 빠른 편 (권장 250~360자/분)";
        }

        function buildQaPairs(messages) {
          var map = {};
          var keys = [];
          for (var i = 0; i < messages.length; i++) {
            var m = messages[i];
            if (m.turnType === "closing") continue;
            var idx = m.questionIndex;
            if (!map[idx]) {
              map[idx] = {
                questionNumber: idx,
                questionCategory: m.questionCategory || "",
                mainQuestion: "",
                mainAnswer: "",
                mainSpeechMetrics: null,
                followUps: [],
              };
              keys.push(idx);
            }
            var item = map[idx];
            if (m.sender === "interviewer") {
              if (m.turnType === "main") {
                item.mainQuestion = m.text;
                if (m.questionCategory) item.questionCategory = m.questionCategory;
              } else if (m.turnType === "followup") {
                item.followUps.push({ question: m.text, answer: "", speechMetrics: null });
              }
            } else {
              if (m.turnType === "main") {
                item.mainAnswer = m.text;
                item.mainSpeechMetrics = m.speechMetrics || null;
              } else if (m.turnType === "reask") {
                item.mainAnswer = item.mainAnswer
                  ? item.mainAnswer + "\n(재질문 답변) " + m.text
                  : m.text;
                item.mainSpeechMetrics = m.speechMetrics || item.mainSpeechMetrics;
              } else if (m.turnType === "followup") {
                if (item.followUps.length > 0) {
                  var lastFu = item.followUps[item.followUps.length - 1];
                  lastFu.answer = m.text;
                  lastFu.speechMetrics = m.speechMetrics || null;
                }
              }
            }
          }

          keys.sort(function (a, b) { return a - b; });
          var pairs = [];
          for (var j = 0; j < keys.length; j++) {
            var p = map[keys[j]];
            if (p.mainQuestion && p.mainAnswer) {
              p.followUpQuestion = p.followUps
                .map(function (f, fi) {
                  return p.followUps.length > 1 ? "(" + (fi + 1) + ") " + f.question : f.question;
                })
                .filter(Boolean)
                .join(" / ");
              p.followUpAnswer = p.followUps
                .map(function (f, fi) {
                  return p.followUps.length > 1 ? "(" + (fi + 1) + ") " + f.answer : f.answer;
                })
                .filter(Boolean)
                .join(" / ");
              p.followUpSpeechMetrics = p.followUps[0] ? p.followUps[0].speechMetrics : null;
              pairs.push(p);
            }
          }
          return pairs;
        }

        function aggregateSpeech(qaPairs) {
          var all = [];
          for (var i = 0; i < qaPairs.length; i++) {
            if (qaPairs[i].mainSpeechMetrics) all.push(qaPairs[i].mainSpeechMetrics);
            if (qaPairs[i].followUpSpeechMetrics) all.push(qaPairs[i].followUpSpeechMetrics);
          }
          var totalDurationSec = 0;
          var totalCharCount = 0;
          var voiceDur = 0;
          var voiceChars = 0;
          var voiceTurns = 0;
          var fillerCounts = { 음: 0, 어: 0, 그니까: 0, 약간: 0 };

          for (var j = 0; j < all.length; j++) {
            var m = all[j];
            totalDurationSec += m.durationSec;
            totalCharCount += m.charCount;
            if (m.usedVoice) {
              voiceTurns++;
              voiceDur += m.durationSec;
              voiceChars += m.charCount;
            }
            fillerCounts.음 += m.fillerCounts.음;
            fillerCounts.어 += m.fillerCounts.어;
            fillerCounts.그니까 += m.fillerCounts.그니까;
            fillerCounts.약간 += m.fillerCounts.약간;
          }

          var hasVoice = voiceTurns > 0 && voiceDur > 0;
          var avgCpm = hasVoice
            ? Math.round((voiceChars / voiceDur) * 60)
            : totalDurationSec > 0
            ? Math.round((totalCharCount / totalDurationSec) * 60)
            : 0;

          return {
            totalDurationSec: totalDurationSec,
            totalCharCount: totalCharCount,
            avgCharsPerMin: avgCpm,
            voiceTurnCount: voiceTurns,
            totalTurnCount: all.length,
            speedAssessment: getSpeedAssessment(avgCpm, hasVoice),
            fillerCounts: fillerCounts,
            totalFillers: fillerCounts.음 + fillerCounts.어 + fillerCounts.그니까 + fillerCounts.약간,
          };
        }

        function generateFeedbackReport(profile, qaPairs) {
          var feedbacks = [];
          var sumContent = 0;
          var sumStructure = 0;
          var sumSpecificity = 0;
          var sumAttitude = 0;

          for (var i = 0; i < qaPairs.length; i++) {
            var qa = qaPairs[i];
            var ans = qa.mainAnswer.trim();
            var fullAns = (ans + " " + (qa.followUpAnswer || "")).trim();
            var len = ans.length;
            var hasNumber = /\d+|%|명|배|건|주|개월|년/.test(fullAns);
            var hasReasoning = /(왜냐하면|때문에|기준|고려해|판단해|이유는|목표)/.test(fullAns) || len >= 70;
            var hasConclusionFirst = len >= 35 && !/^(음|어|글쎄|모르)/.test(ans);
            var hasConcrete = hasNumber || /(프로젝트|서비스|동아리|학생회|인턴|해결|도입|구축|개선)/.test(fullAns);
            var hasClosing = /(배웠|기여하|하겠습니다|입니다|다짐|성장)/.test(fullAns) || len >= 60;

            var cScore = Math.min(96, Math.max(52, 55 + Math.round(len / 6) + (hasReasoning ? 8 : 0)));
            var sScore =
              52 +
              (hasConclusionFirst ? 12 : 0) +
              (hasReasoning ? 12 : 0) +
              (hasConcrete ? 10 : 0) +
              (hasClosing ? 8 : 0);
            var spScore = Math.min(96, Math.max(48, 50 + (hasConcrete ? 20 : 0) + (hasNumber ? 16 : 0) + (qa.followUpAnswer ? 6 : 0)));
            var aScore = Math.min(95, Math.max(60, 70 + (qa.followUpAnswer ? 8 : 4) + (len >= 50 ? 10 : 0)));

            sumContent += cScore;
            sumStructure += sScore;
            sumSpecificity += spScore;
            sumAttitude += aScore;

            var quotedSnippet = ans.slice(0, 34) + (ans.length > 34 ? "..." : "");
            var strengths =
              '"' +
              quotedSnippet +
              '"라고 답하며 질문 의도에 맞춰 핵심 방향을 잡아낸 점이 좋습니다.' +
              (qa.followUpAnswer ? " 이어진 꼬리질문에서도 논점을 놓치지 않고 응답을 보완했습니다." : "");

            var missingParts = [];
            if (!hasConclusionFirst) missingParts.push("첫 문장에 결론을 먼저 두괄식으로 배치하고");
            if (!hasNumber) missingParts.push("정량 수치나 구체적 변화 결과를 한 가지 더 넣고");
            if (!hasReasoning) missingParts.push("왜 그 선택을 했는지 판단 근거를 1문장 추가해");

            var improvements =
              missingParts.length > 0
                ? missingParts.join(", ") + " 답변의 설득력을 높여 보세요."
                : "현재 구조와 근거가 탄탄합니다. 마지막 문장에서 " +
                  profile.role +
                  " 직무(학과)에 어떻게 기여할지 한 번 더 강조하면 더욱 완성도가 높아집니다.";

            var bgHint = (profile.background || "").trim();
            var betterExample =
              "[결론] " +
              (ans.length >= 20 ? ans.split(/[.?!\n]/)[0].trim() : profile.role + "에 기여하기 위해 제 경험을 중심으로 말씀드리겠습니다.") +
              "\n[근거·사례] 실제로 " +
              (hasConcrete ? quotedSnippet : bgHint ? "'" + bgHint.slice(0, 38) + "' 과정에서" : "[여기에 본인이 직접 맡은 과제·경험을 추가]") +
              " 당시 핵심 문제를 정의하고 직접 실행해 [구체적 수치나 변화 결과]를 만들었습니다." +
              "\n[마무리] 이 경험을 바탕으로 " +
              profile.organization +
              "에서도 주도적으로 문제를 해결하겠습니다.";

            feedbacks.push({
              questionNumber: qa.questionNumber,
              mainQuestion: qa.mainQuestion,
              followUpQuestion: qa.followUpQuestion || "",
              strengths: strengths,
              improvements: improvements,
              structureCheck: {
                hasConclusionFirst: hasConclusionFirst,
                hasReasoning: hasReasoning,
                hasConcreteExample: hasConcrete,
                hasClosing: hasClosing,
              },
              betterAnswerExample: betterExample,
            });
          }

          var n = Math.max(1, qaPairs.length);
          var scores = {
            content: Math.round(sumContent / n),
            structure: Math.round(sumStructure / n),
            specificity: Math.round(sumSpecificity / n),
            attitude: Math.round(sumAttitude / n),
          };
          var overall = Math.round((scores.content + scores.structure + scores.specificity + scores.attitude) / 4);

          return {
            overallScore: overall,
            overallComment:
              overall >= 82
                ? "질문 핵심을 정확히 짚고 구체적인 경험과 논리를 균형 있게 전달했습니다. 실전에서는 첫 문장 두괄식과 수치 근거만 한 번 더 점검하면 충분합니다."
                : overall >= 68
                ? "전반적인 답변 흐름이 안정적이며 질문 의도를 잘 따라가고 있습니다. 일부 문항에서 본인이 직접 맡은 역할과 결과 수치를 보강하면 점수가 크게 올라갑니다."
                : "면접에 끝까지 성실히 응해주셨습니다. 각 질문마다 결론을 첫 문장에 두고, 실제로 겪은 사례 1가지와 결과를 붙이는 연습을 추천합니다.",
            scores: scores,
            questionFeedbacks: feedbacks,
            nextPracticeItems: [
              "첫 문장에 질문에 대한 핵심 결론을 20자 내외로 먼저 말하기(두괄식)",
              "경험 답변마다 본인의 역할과 구체적인 수치·결과 변화를 1가지 이상 포함하기",
              "꼬리질문에 대비해 선택한 대안과 판단 이유를 1~2문장으로 미리 정리하기",
            ],
          };
        }

        /* =========================================================

        function updateHeaderNav() {
          var canResearch = Boolean(state.research);
          var canInterview = Boolean(state.research);
          var canResult = state.qaPairs.length > 0;

          var desktopBtns = document.querySelectorAll("#desktop-nav .nav-step-btn");
          for (var i = 0; i < desktopBtns.length; i++) {
            var btn = desktopBtns[i];
            var s = btn.getAttribute("data-step");
            var unlocked =
              s === "input" ||
              (s === "research" && canResearch) ||
              (s === "interview" && canInterview) ||
              (s === "result" && canResult);
            btn.setAttribute("data-active", String(state.step === s));
            btn.setAttribute("data-unlocked", String(unlocked));
            btn.disabled = !unlocked;
          }

          var mobileItems = document.querySelectorAll("#mobile-nav .mobile-step-item");
          for (var j = 0; j < mobileItems.length; j++) {
            var item = mobileItems[j];
            item.setAttribute("data-active", String(state.step === item.getAttribute("data-step")));
          }

        function stopTimer() {
          if (state.elapsedTimerId !== null) {
            window.clearInterval(state.elapsedTimerId);
            state.elapsedTimerId = null;
          }
        }

        function startTimer() {
          stopTimer();
          state.elapsedTimerId = window.setInterval(function () {
            if (state.step !== "interview" || state.isComplete) return;
            state.elapsedSec += 1;
            var clockEl = document.getElementById("interview-elapsed-clock");
            if (clockEl) {
              clockEl.textContent = "경과 " + formatElapsed(state.elapsedSec);
            }
          }, 1000);
        }

        function stopSpeaking() {
          state.activeUtterances = 0;
          if (state.ttsSupported) {
            try {
              window.speechSynthesis.cancel();
            } catch (e) {
              // ignore
            }
          }
          state.isSpeaking = false;
        }

        function enqueueSpeechChunk(chunkText, force) {
          var clean = String(chunkText || "").trim();
          if (!clean || !state.ttsSupported) return;
          if (!force && !state.voiceEnabled) return;

          try {
            var utt = new SpeechSynthesisUtterance(clean);
            utt.lang = "ko-KR";
            utt.rate = 1.0;
            var voices = window.speechSynthesis.getVoices();
            for (var i = 0; i < voices.length; i++) {
              if (voices[i].lang && voices[i].lang.toLowerCase().indexOf("ko") === 0) {
                utt.voice = voices[i];
                break;
              }
            }
            state.activeUtterances += 1;
            utt.onstart = function () {
              state.isSpeaking = true;
              if (state.pendingTtsMeasure && !state.pendingTtsMeasure.recorded) {
                state.pendingTtsMeasure.recorded = true;
                var ttsMs = Math.round(performance.now() - state.pendingTtsMeasure.sendPerf);
                if (state.turnMetrics) {
                  state.turnMetrics.ttsStartMs = ttsMs;
                  state.turnMetrics.ttsStatus = "started";
                  renderMetricsHud();
                }
              }
            };
            var onFinish = function () {
              state.activeUtterances = Math.max(0, state.activeUtterances - 1);
              if (state.activeUtterances === 0) {
                state.isSpeaking = false;
              }
            };
            utt.onend = onFinish;
            utt.onerror = onFinish;
            window.speechSynthesis.speak(utt);
          } catch (e) {
            state.activeUtterances = 0;
            state.isSpeaking = false;
          }
        }

        function speakText(text, force) {
          if (!state.ttsSupported) return;
          if (!force && !state.voiceEnabled) return;
          stopSpeaking();
          enqueueSpeechChunk(text, force);
        }

        function stopListening() {
          if (state.micStartMs !== null) {
            state.accumulatedMicMs += Date.now() - state.micStartMs;
            state.micStartMs = null;
          }
          if (state.recognition) {
            try {
              state.recognition.stop();
            } catch (e) {
              // ignore
            }
            state.recognition = null;
          }
          state.isListening = false;
          state.interimText = "";
        }

        function startListening() {
          var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!Ctor || state.isWaiting || state.isComplete) return;
          stopSpeaking();
          state.micError = null;

          try {
            var rec = new Ctor();
            rec.lang = "ko-KR";
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = function () {
              state.micStartMs = Date.now();
              state.isListening = true;
              state.micError = null;
              renderInterview();
            };

            rec.onresult = function (event) {
              var finalChunk = "";
              var interimChunk = "";
              for (var i = event.resultIndex; i < event.results.length; i++) {
                var res = event.results[i];
                var txt = res[0] ? res[0].transcript : "";
                if (res.isFinal) {
                  finalChunk += txt + " ";
                } else {
                  interimChunk += txt;
                }
              }
              if (finalChunk.trim()) {
                var clean = finalChunk.trim();
                state.rawSpokenText = state.rawSpokenText
                  ? state.rawSpokenText + " " + clean
                  : clean;
                state.inputDraft = state.inputDraft.trim()
                  ? state.inputDraft.replace(/\s+$/, "") + " " + clean
                  : clean;
              }
              state.interimText = interimChunk.trim();
              var textarea = document.getElementById("chat-input-box");
              if (textarea) {
                textarea.value = state.inputDraft;
              }
              var interimEl = document.getElementById("listening-interim-text");
              if (interimEl) {
                interimEl.textContent =
                  state.interimText || "말씀하시면 아래 입력창에 글자로 변환됩니다.";
              }
            };

            rec.onerror = function (event) {
              if (event.error === "aborted") return;
              if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                state.micError =
                  "마이크 권한이 차단되어 있습니다. 브라우저 설정에서 마이크를 허용하거나 텍스트로 입력해 주세요.";
              } else if (event.error === "audio-capture") {
                state.micError = "마이크 장치를 찾을 수 없습니다. 텍스트로 답변을 입력해 주세요.";
              } else if (event.error === "no-speech") {
                state.micError = "목소리가 잘 들리지 않았습니다. 다시 눌러 말씀해 주세요.";
              } else {
                state.micError = "음성 인식 중 오류가 발생했습니다(" + event.error + "). 텍스트로 이어서 답변하실 수 있습니다.";
              }
              renderInterview();
            };

            rec.onend = function () {
              if (state.micStartMs !== null) {
                state.accumulatedMicMs += Date.now() - state.micStartMs;
                state.micStartMs = null;
              }
              state.recognition = null;
              state.isListening = false;
              state.interimText = "";
              renderInterview();
            };

            state.recognition = rec;
            rec.start();
          } catch (e) {
            state.micError = "음성 인식을 시작하지 못했습니다. 텍스트 입력을 이용해 주세요.";
            state.isListening = false;
            renderInterview();
          }
        }

          // Bind input handlers

          if (cached) {
            state.research = Object.assign({}, cached.research, {
              interviewMode: p.interviewMode,
              focusedType: p.focusedType,
            });
            state.isFromCache = true;
            state.cachedAt = cached.cachedAt;
          } else {
            if (forceRefresh) {
              state.variationCount += 1;
            }
            var generated = generateResearchSummary(p, state.variationCount);
            var saved = saveCachedResearch(
              p.organization,
              p.role,
              generated,
              p.pastedReviews
            );
            state.research = generated;
            state.isFromCache = false;
            state.cachedAt = saved.cachedAt;
          }

          state.selectedRound = "전체 종합";
          state.activeMode = p.interviewMode;
          state.activeFocusedType = p.focusedType;
          state.activeLength = p.interviewLength || "medium";
          state.step = "research";
          render();
