        function prepareNextMain(nextQIndex) {
          var total = getLengthCount(state.activeLength);
          if (nextQIndex > total || !state.plannedQuestions.length) {
            state.preloadedNextMain = null;
            return;
          }
          var target =
            state.plannedQuestions[nextQIndex - 1] ||
            state.plannedQuestions[state.plannedQuestions.length - 1];
          state.preloadedNextMain = {
            questionIndex: nextQIndex,
            stageName: target.stageName,
            baseQuestionText: target.question,
            questionBasis: target.questionBasis || "모델 지식 기반",
          };
        }

        function startMockInterview() {
          stopSpeaking();
          stopListening();
          if (state.streamTimerId) {
            window.clearTimeout(state.streamTimerId);
            state.streamTimerId = null;
          }

          var total = getLengthCount(state.activeLength);
          var plan = buildPlannedQuestions(
            state.profile,
            state.research,
            state.activeMode,
            state.activeFocusedType,
            state.selectedRound,
            total
          );

          state.plannedQuestions = plan;
          state.currentQuestionIndex = 1;
          state.currentTurnType = "main";
          state.followUpCount = 0;
          state.offTopicCount = 0;
          state.isComplete = false;
          state.isWaiting = false;
          state.streamingBubble = null;
          state.elapsedSec = 0;
          state.inputDraft = "";
          state.turnMetrics = null;
          state.qaPairs = [];
          state.report = null;
          resetTurnSpeechTracking();

          var first = plan[0];
          state.messages = [
            {
              id: "msg-init-1",
              sender: "interviewer",
              text: first.question,
              questionIndex: 1,
              turnType: "main",
              questionCategory: first.stageName,
              questionBasis: first.questionBasis,
              timestamp: formatTimeNow(),
            },
          ];

          prepareNextMain(2);
          state.step = "interview";
          render();
          startTimer();
          speakText(first.question);
        }

        function advanceToPreloadedMain(nextQIndex, withBriefReaction, customPrefix) {
          var pre =
            state.preloadedNextMain && state.preloadedNextMain.questionIndex === nextQIndex
              ? state.preloadedNextMain
              : null;
          if (!pre) {
            prepareNextMain(nextQIndex);
            pre = state.preloadedNextMain;
          }

          var total = getLengthCount(state.activeLength);
          var stageName = pre ? pre.stageName : getStageInfo(nextQIndex, total).stageName;
          var baseText = pre
            ? pre.baseQuestionText
            : nextQIndex >= total
            ? "마지막으로 꼭 하고 싶은 말씀이나 궁금한 점이 있으신가요?"
            : state.profile.role + "와 관련된 본인의 경험을 말씀해 주시겠어요?";
          var reactions = ["좋습니다.", "잘 들었습니다.", "네, 알겠습니다."];
          var alreadyGreet = /^(좋습니다|네,|알겠습니다|잘 들었습니다)/.test(baseText);

          var fullQ = customPrefix
            ? customPrefix + " " + baseText
            : withBriefReaction && nextQIndex > 1 && !alreadyGreet
            ? reactions[nextQIndex % reactions.length] + " " + baseText
            : baseText;

          var msg = {
            id: "msg-" + Date.now() + "-main",
            sender: "interviewer",
            text: fullQ,
            questionIndex: nextQIndex,
            turnType: "main",
            questionCategory: stageName,
            questionBasis: pre ? pre.questionBasis : "모델 지식 기반",
            timestamp: formatTimeNow(),
          };

          state.messages.push(msg);
          state.currentQuestionIndex = nextQIndex;
          state.currentTurnType = "main";
          state.followUpCount = 0;
          state.offTopicCount = 0;
          state.turnStartMs = Date.now();

          prepareNextMain(nextQIndex + 1);
          renderInterview();
          speakText(msg.text);
        }

        function streamInterviewerMessage(opts) {
          var fullMessage = opts.text;
          var qIndex = opts.questionIndex;
          var turnType = opts.turnType;
          var categoryLabel = opts.categoryLabel;
          var nextFollowUp = opts.nextFollowUp;
          var relevance = opts.relevance;
          var sendPerf = opts.sendPerf;
          var tGenStart = performance.now();

          var chars = Array.from(fullMessage);
          var cursor = 0;
          var currentText = "";
          var ttsPending = "";
          var firstShownRecorded = false;

          state.streamingBubble = {
            text: "",
            questionIndex: qIndex,
            turnType: turnType,
            questionCategory: categoryLabel,
          };

          function flushSentences(forceAll) {
            if (!ttsPending.trim()) return;
            if (forceAll) {
              enqueueSpeechChunk(ttsPending.trim(), false);
              ttsPending = "";
              return;
            }
            var m = ttsPending.match(/^([\s\S]*?[.?!\n])(\s*[\s\S]*)$/);
            while (m) {
              var s = m[1].trim();
              ttsPending = m[2];
              if (s) enqueueSpeechChunk(s, false);
              m = ttsPending.match(/^([\s\S]*?[.?!\n])(\s*[\s\S]*)$/);
            }
          }

          function stepStream() {
            var stepSize = 3;
            var piece = chars.slice(cursor, cursor + stepSize).join("");
            cursor += stepSize;

            if (!firstShownRecorded) {
              firstShownRecorded = true;
              state.turnMetrics.waitToFirstResponseMs = Math.round(performance.now() - sendPerf);
            }

            currentText += piece;
            ttsPending += piece;
            state.streamingBubble.text = currentText;

            // Update streaming DOM cleanly without stealing focus
            var streamTextEl = document.getElementById("streaming-bubble-text");
            var thinkingEl = document.getElementById("thinking-indicator");
            if (streamTextEl) {
              streamTextEl.innerHTML =
                escapeHtml(currentText) + '<span class="stream-caret" aria-hidden="true"></span>';
              var wrapEl = document.getElementById("streaming-bubble-wrap");
              if (wrapEl) wrapEl.hidden = false;
              if (thinkingEl) thinkingEl.hidden = true;
            } else {
              renderInterview();
            }

            flushSentences(false);

            if (cursor < chars.length) {
              state.streamTimerId = window.setTimeout(stepStream, 16);
              return;
            }

            // Stream finished
            flushSentences(true);
            state.streamTimerId = null;
            state.isWaiting = false;
            state.streamingBubble = null;

            var genMs = Math.round(performance.now() - tGenStart);
            var totalMs = Math.round(performance.now() - sendPerf);
            state.turnMetrics.generationMs = genMs;
            state.turnMetrics.totalUntilShownMs = totalMs;
            state.turnMetrics.status = "done";

            state.messages.push({
              id: "msg-" + Date.now() + "-iv",
              sender: "interviewer",
              text: currentText.trim(),
              questionIndex: qIndex,
              turnType: turnType,
              followUpNumber: turnType === "followup" ? nextFollowUp : undefined,
              questionCategory: categoryLabel,
              timestamp: formatTimeNow(),
            });

            if (turnType === "reask") {
              state.currentTurnType = "reask";
              state.offTopicCount += 1;
            } else if (turnType === "closing") {
              state.currentTurnType = "closing";
              state.isComplete = true;
              stopTimer();
            } else {
              state.currentTurnType = "followup";
              state.followUpCount = nextFollowUp;
              if (relevance === "정상") state.offTopicCount = 0;
            }

            state.turnStartMs = Date.now();
            renderInterview();
            renderMetricsHud();
          }

          state.streamTimerId = window.setTimeout(stepStream, 120);
        }

        function handleSendAnswer() {
          if (state.isListening) stopListening();
          stopSpeaking();

          var inputEl = document.getElementById("chat-input-box");
          var rawVal = inputEl ? inputEl.value : state.inputDraft;
          var trimmed = String(rawVal || "").trim();
          if (!trimmed || state.isWaiting || state.isComplete) return;

          var sendPerf = performance.now();
          var speechMetrics = calcSpeechMetrics(
            trimmed,
            state.rawSpokenText,
            state.accumulatedMicMs,
            Date.now() - state.turnStartMs
          );

          state.messages.push({
            id: "msg-" + Date.now() + "-cand",
            sender: "candidate",
            text: trimmed,
            questionIndex: state.currentQuestionIndex,
            turnType: state.currentTurnType,
            followUpNumber: state.currentTurnType === "followup" ? state.followUpCount : undefined,
            timestamp: formatTimeNow(),
            speechMetrics: speechMetrics,
          });

          state.inputDraft = "";
          resetTurnSpeechTracking();
          state.isWaiting = true;
          state.streamingBubble = null;

          var qIdx = state.currentQuestionIndex;
          var total = getLengthCount(state.activeLength);

          state.pendingTtsMeasure = { sendPerf: sendPerf, recorded: false };
          state.turnMetrics = {
            turnLabel: "질문 " + qIdx + " 답변 후",
            status: "measuring",
            actionLabel: qIdx >= total ? "마무리" : "판단 중...",
            relevanceMs: qIdx >= total ? 0 : null,
            waitToFirstResponseMs: null,
            generationMs: null,
            totalUntilShownMs: null,
            ttsStartMs: null,
            ttsStatus: !state.ttsSupported
              ? "unsupported"
              : !state.voiceEnabled
              ? "disabled"
              : "pending",
          };

          renderInterview();
          renderMetricsHud();

          // Final question closing flow
          if (qIdx >= total) {
            var closingDecision = evaluateClosingTurn(trimmed);
            if (!closingDecision.needsStream) {
              var instantMs = Math.round(performance.now() - sendPerf);
              state.turnMetrics.actionLabel = "즉시 마무리";
              state.turnMetrics.relevanceMs = 0;
              state.turnMetrics.waitToFirstResponseMs = instantMs;
              state.turnMetrics.generationMs = 0;
              state.turnMetrics.totalUntilShownMs = instantMs;
              state.turnMetrics.status = "done";

              state.isWaiting = false;
              state.currentTurnType = "closing";
              state.isComplete = true;
              stopTimer();
              state.messages.push({
                id: "msg-" + Date.now() + "-close",
                sender: "interviewer",
                text: closingDecision.message,
                questionIndex: qIdx,
                turnType: "closing",
                questionCategory: "마무리",
                timestamp: formatTimeNow(),
              });
              renderInterview();
              renderMetricsHud();
              speakText(closingDecision.message);
              return;
            }

            streamInterviewerMessage({
              text: closingDecision.message,
              questionIndex: qIdx,
              turnType: "closing",
              categoryLabel: "마무리",
              nextFollowUp: 0,
              relevance: "정상",
              sendPerf: sendPerf,
            });
            return;
          }

          // Standard answer judgment (short non-blocking tick so "면접관이 생각 중..." renders immediately)
          var mainQ = "";
          var lastIvQ = "";
          for (var i = 0; i < state.messages.length; i++) {
            var msg = state.messages[i];
            if (msg.sender === "interviewer") {
              lastIvQ = msg.text;
              if (msg.questionIndex === qIdx && msg.turnType === "main") {
                mainQ = msg.text;
              }
            }
          }

          window.setTimeout(function () {
            var decision = evaluateCandidateTurn({
              answer: trimmed,
              mainQuestion: mainQ || lastIvQ,
              lastQuestion: lastIvQ,
              followUpCount: state.followUpCount,
              offTopicCount: state.offTopicCount,
              interviewMode: state.activeMode,
              focusedType: state.activeFocusedType,
            });

            var relMs = Math.round(performance.now() - sendPerf);
            state.turnMetrics.relevanceMs = relMs;
            state.turnMetrics.actionLabel =
              decision.action === "reask"
                ? "핵심 재질문"
                : decision.action === "skip_next_question"
                ? "무관 2회 → 다음 질문"
                : decision.action === "next_question"
                ? "다음 본 질문"
                : "꼬리질문";

            if (decision.action === "next_question") {
              state.turnMetrics.waitToFirstResponseMs = relMs;
              state.turnMetrics.generationMs = 0;
              state.turnMetrics.totalUntilShownMs = relMs;
              state.turnMetrics.status = "done";
              state.isWaiting = false;
              renderMetricsHud();
              advanceToPreloadedMain(qIdx + 1, true);
              return;
            }

            if (decision.action === "skip_next_question") {
              state.turnMetrics.waitToFirstResponseMs = relMs;
              state.turnMetrics.generationMs = 0;
              state.turnMetrics.totalUntilShownMs = relMs;
              state.turnMetrics.status = "done";
              state.isWaiting = false;
              renderMetricsHud();
              advanceToPreloadedMain(qIdx + 1, false, "다음 질문으로 넘어가겠습니다.");
              return;
            }

            renderMetricsHud();
            var nextFu = decision.action === "followup" ? state.followUpCount + 1 : state.followUpCount;
            streamInterviewerMessage({
              text: decision.message,
              questionIndex: qIdx,
              turnType: decision.action === "reask" ? "reask" : "followup",
              categoryLabel: decision.action === "reask" ? "핵심 재질문" : "꼬리질문 " + nextFu + "/2",
              nextFollowUp: nextFu,
              relevance: decision.relevance,
              sendPerf: sendPerf,
            });
          }, 90);
        }

        function finishAndShowResult() {
          stopSpeaking();
          stopListening();
          stopTimer();
          if (state.streamTimerId) {
            window.clearTimeout(state.streamTimerId);
            state.streamTimerId = null;
          }
          var pairs = buildQaPairs(state.messages);
          state.qaPairs = pairs;
          state.report = generateFeedbackReport(state.profile, pairs);
          state.step = "result";
          render();
        }

        function renderInterview() {
          var total = getLengthCount(state.activeLength);
          var progressPct = Math.min(100, Math.round((state.currentQuestionIndex / total) * 100));
          var stageName = getStageInfo(state.currentQuestionIndex, total).stageName;
          var completedCount = buildQaPairs(state.messages).length;
          var canFinishNow = completedCount >= 1 && !state.isWaiting;
          var modeLabel =
            state.activeMode === "comprehensive"
              ? "종합 면접(실제처럼)"
              : "집중 연습(" + state.activeFocusedType + ")";

          var messagesHtml = state.messages
            .map(function (msg, idx) {
              var isIv = msg.sender === "interviewer";
              var turnLabel = "";
              if (isIv && msg.turnType !== "closing") {
                turnLabel =
                  msg.turnType === "reask"
                    ? "질문 " + msg.questionIndex + " (핵심 재질문)"
                    : msg.turnType === "followup"
                    ? "질문 " + msg.questionIndex + " 꼬리질문"
                    : "질문 " +
                      msg.questionIndex +
                      (msg.questionCategory ? " (" + msg.questionCategory + ")" : "");
              }

              var basisSpan =
                isIv && msg.turnType === "main" && msg.questionBasis
                  ? '<span aria-hidden="true">·</span><span style="font-weight:600;color:' +
                    (msg.questionBasis === "후기 기반" ? "var(--teal)" : "var(--accent)") +
                    ';">' +
                    escapeHtml(msg.questionBasis) +
                    "</span>"
                  : "";

              var replayBtn =
                isIv && state.ttsSupported
                  ? '<span aria-hidden="true">·</span><button type="button" class="link-btn" data-speak-idx="' +
                    idx +
                    '">' +
                    (state.isSpeaking ? "읽기 중지" : "다시 듣기") +
                    "</button>"
                  : "";

              var speechHtml =
                !isIv && msg.speechMetrics
                  ? '<div class="msg-speech-meta font-mono-tabular">' +
                    (msg.speechMetrics.usedVoice ? "음성 답변" : "텍스트 입력") +
                    " · " +
                    msg.speechMetrics.durationSec +
                    "초 · " +
                    msg.speechMetrics.charCount +
                    "자 (" +
                    msg.speechMetrics.charsPerMin +
                    "자/분)" +
                    (msg.speechMetrics.totalFillers > 0
                      ? " · 군더더기 " + msg.speechMetrics.totalFillers + "회"
                      : "") +
                    "</div>"
                  : "";

              return (
                '<div class="msg-row ' +
                (isIv ? "interviewer" : "candidate") +
                '">' +
                '  <div class="msg-meta">' +
                '    <strong style="color:var(--text-primary);">' +
                (isIv ? "면접관" : "내 답변") +
                "</strong>" +
                (turnLabel ? '<span aria-hidden="true">·</span><span>' + escapeHtml(turnLabel) + "</span>" : "") +
                basisSpan +
                '    <span aria-hidden="true">·</span><span class="tabular-nums">' +
                escapeHtml(msg.timestamp) +
                "</span>" +
                replayBtn +
                "  </div>" +
                '  <div class="msg-bubble ' +
                (isIv ? "interviewer" : "candidate") +
                '">' +
                escapeHtml(msg.text) +
                "</div>" +
                speechHtml +
                "</div>"
              );
            })
            .join("");

          var streamLabel =
            state.streamingBubble && state.streamingBubble.turnType === "reask"
              ? "질문 " + state.streamingBubble.questionIndex + " (핵심 재질문)"
              : state.streamingBubble
              ? "질문 " + state.streamingBubble.questionIndex + " 꼬리질문"
              : "";

          var streamingHtml =
            '<div id="streaming-bubble-wrap" class="msg-row interviewer" ' +
            (state.streamingBubble && state.streamingBubble.text ? "" : "hidden") +
            ">" +
            '  <div class="msg-meta"><strong style="color:var(--text-primary);">면접관</strong>' +
            (streamLabel ? '<span aria-hidden="true">·</span><span>' + escapeHtml(streamLabel) + "</span>" : "") +
            "  </div>" +
            '  <div id="streaming-bubble-text" class="msg-bubble interviewer">' +
            (state.streamingBubble && state.streamingBubble.text
              ? escapeHtml(state.streamingBubble.text) +
                '<span class="stream-caret" aria-hidden="true"></span>'
              : "") +
            "</div>" +
            "</div>";

          var thinkingHtml =
            '<div id="thinking-indicator" class="msg-row interviewer" ' +
            (state.isWaiting && (!state.streamingBubble || !state.streamingBubble.text) ? "" : "hidden") +
            ">" +
            '  <div class="msg-meta"><strong style="color:var(--text-primary);">면접관</strong></div>' +
            '  <div class="msg-bubble interviewer" style="display:inline-flex;align-items:center;gap:10px;color:var(--text-secondary);">' +
            '    <span class="thinking-dots" aria-hidden="true"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></span>' +
            "    <span>면접관이 생각 중...</span>" +
            "  </div>" +
            "</div>";

          var footerHtml = state.isComplete
            ? '<div class="chat-footer row-between">' +
              '  <div class="row-wrap" style="font-size:14px;color:var(--text-secondary);">' +
              '    <span style="color:var(--teal);display:inline-flex;">' +
              iconSvg("check", "icon-sm") +
              "</span>" +
              "    <span>모의면접이 모두 끝났습니다. 답변별 상세 피드백과 말하기 분석을 확인해 보세요.</span>" +
              "  </div>" +
              '  <button type="button" id="iv-view-result-btn" class="btn btn-primary">결과 및 피드백 보기' +
              iconSvg("arrowRight", "icon-xs") +
              "</button>" +
              "</div>"
            : '<div class="chat-footer stack-sm">' +
              (!state.sttSupported
                ? '<div class="inset-box row-wrap" style="padding:8px 12px;font-size:12px;color:var(--text-muted);">' +
                  iconSvg("micOff", "icon-xs") +
                  "<span>이 브라우저에서는 음성 인식이 지원되지 않아 텍스트 입력으로 진행합니다.</span></div>"
                : "") +
              (state.micError
                ? '<div role="status" class="status-banner status-warn" style="padding:8px 12px;font-size:12px;">' +
                  escapeHtml(state.micError) +
                  "</div>"
                : "") +
              (state.isListening
                ? '<div class="tint-box row-between" style="padding:10px 14px;">' +
                  '  <div class="row-wrap" style="gap:12px;min-width:0;flex:1;">' +
                  '    <div class="voice-wave" aria-hidden="true"><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span></div>' +
                  '    <div style="min-width:0;font-size:12px;"><strong style="color:var(--accent);margin-right:6px;">듣는 중...</strong><span id="listening-interim-text" style="color:var(--text-secondary);">' +
                  escapeHtml(state.interimText || "말씀하시면 아래 입력창에 글자로 변환됩니다.") +
                  "</span></div>" +
                  "  </div>" +
                  '  <button type="button" id="iv-stop-mic-btn" class="btn btn-secondary btn-sm">말하기 멈춤</button>' +
                  "</div>"
                : "") +
              '  <div style="display:flex;align-items:flex-end;gap:8px;">' +
              (state.sttSupported
                ? '<button type="button" id="iv-mic-btn" class="btn ' +
                  (state.isListening ? "btn-danger" : "btn-secondary") +
                  '" ' +
                  (state.isWaiting ? "disabled" : "") +
                  ' aria-label="' +
                  (state.isListening ? "음성 입력 중지" : "마이크로 답변하기") +
                  '" aria-pressed="' +
                  String(state.isListening) +
                  '">' +
                  iconSvg(state.isListening ? "square" : "mic", "icon-xs") +
                  "<span>" +
                  (state.isListening ? "중지" : "말하기") +
                  "</span></button>"
                : "") +
              '    <textarea id="chat-input-box" class="text-area" rows="2" style="min-height:46px;flex:1;" ' +
              (state.isWaiting ? "disabled" : "") +
              ' placeholder="' +
              (state.sttSupported
                ? "마이크 버튼을 눌러 말하거나 직접 입력하세요. 보내기 전에 수정할 수 있어요."
                : "답변을 입력하세요. (Enter 전송, Shift+Enter 줄바꿈)") +
              '">' +
              escapeHtml(state.inputDraft) +
              "</textarea>" +
              '    <button type="button" id="iv-send-btn" class="btn btn-primary" ' +
              (state.isWaiting || !state.inputDraft.trim() ? "disabled" : "") +
              ' aria-label="답변 전송">' +
              iconSvg("send", "icon-xs") +
              "<span>전송</span></button>" +
              "  </div>" +
              "</div>";

          rootEl.innerHTML =
            '<div class="container-narrow" style="padding-top:24px;padding-bottom:24px;">' +
            '  <div class="chat-shell">' +
            '    <div class="chat-header stack-sm">' +
            '      <div class="row-between">' +
            "        <div>" +
            '          <div style="font-size:14px;font-weight:700;">' +
            escapeHtml(state.profile.organization) +
            " 면접관</div>" +
            '          <div style="font-size:12px;color:var(--text-muted);">' +
            escapeHtml(state.profile.role) +
            " · " +
            escapeHtml(modeLabel) +
            (state.selectedRound !== "전체 종합" ? " · " + escapeHtml(state.selectedRound) : "") +
            "</div>" +
            "        </div>" +
            '        <div class="row-wrap">' +
            (state.ttsSupported
              ? '<button type="button" id="iv-voice-toggle" class="btn btn-secondary btn-sm">' +
                iconSvg(state.voiceEnabled ? "volume" : "volumeOff", "icon-xs") +
                (state.voiceEnabled ? "음성 읽기 켜짐" : "음성 꺼짐") +
                "</button>"
              : "") +
            '          <button type="button" id="iv-finish-early-btn" class="btn btn-secondary btn-sm" ' +
            (canFinishNow ? "" : "disabled") +
            ">면접 종료하고 결과 보기</button>" +
            "        </div>" +
            "      </div>" +
            '      <div class="stack-sm" style="gap:6px;">' +
            '        <div class="row-between" style="font-size:12px;">' +
            '          <span class="font-mono-tabular" style="font-weight:600;">질문 ' +
            state.currentQuestionIndex +
            " / " +
            total +
            ' <span style="font-weight:400;color:var(--text-muted);">· ' +
            escapeHtml(stageName) +
            "</span></span>" +
            '          <span id="interview-elapsed-clock" class="font-mono-tabular" style="font-weight:600;color:var(--text-secondary);">경과 ' +
            formatElapsed(state.elapsedSec) +
            "</span>" +
            "        </div>" +
            '        <div class="progress-track"><div class="progress-fill" style="width:' +
            progressPct +
            '%;"></div></div>' +
            "      </div>" +
            "    </div>" +
            '    <div class="chat-messages" id="chat-scroll-box">' +
            messagesHtml +
            streamingHtml +
            thinkingHtml +
            "    </div>" +
            footerHtml +
            "  </div>" +
            "</div>";

          var scrollBox = document.getElementById("chat-scroll-box");
          if (scrollBox) {
            scrollBox.scrollTop = scrollBox.scrollHeight;
          }

          var voiceBtn = document.getElementById("iv-voice-toggle");
          if (voiceBtn) {
            voiceBtn.onclick = function () {
              state.voiceEnabled = !state.voiceEnabled;
              if (!state.voiceEnabled) stopSpeaking();
              renderInterview();
            };
          }

          var finishBtn = document.getElementById("iv-finish-early-btn");
          if (finishBtn) {
            finishBtn.onclick = finishAndShowResult;
          }

          var viewResultBtn = document.getElementById("iv-view-result-btn");
          if (viewResultBtn) {
            viewResultBtn.onclick = finishAndShowResult;
          }

          var speakBtns = rootEl.querySelectorAll("[data-speak-idx]");
          for (var i = 0; i < speakBtns.length; i++) {
            speakBtns[i].onclick = function () {
              var msg = state.messages[Number(this.getAttribute("data-speak-idx"))];
              if (!msg) return;
              if (state.isSpeaking) {
                stopSpeaking();
                renderInterview();
              } else {
                speakText(msg.text, true);
              }
            };
          }

          var micBtn = document.getElementById("iv-mic-btn");
          if (micBtn) {
            micBtn.onclick = function () {
              if (state.isListening) stopListening();
              else startListening();
            };
          }

          var stopMicBtn = document.getElementById("iv-stop-mic-btn");

          }

          var chatInput = document.getElementById("chat-input-box");

          if (chatInput) {
            chatInput.oninput = function (e) {
              state.inputDraft = e.target.value;
              if (sendBtn) {
                sendBtn.disabled = state.isWaiting || !state.inputDraft.trim();
              }
            };
            chatInput.onkeydown = function (e) {
              if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                handleSendAnswer();
              }
            };
            if (!state.isWaiting && !state.isComplete) {

            }

          updateHeaderNav();

          if (document && document.documentElement) {

          }
        } catch (e) {
          CLEAN_SOURCE_SNAPSHOT = "";
        }

        function triggerHtmlFileDownload(htmlText) {
          var blob = new Blob([htmlText], { type: "text/html;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "index.html";
          link.style.display = "none";
          document.body.appendChild(link);
          link.click();
          window.setTimeout(function () {
            if (link.parentNode) link.parentNode.removeChild(link);
            URL.revokeObjectURL(url);
          }, 1500);
        }

        function downloadStandaloneHtml() {
          var btn = document.getElementById("header-download-btn");
          var labelEl = document.getElementById("header-download-label");
          var setLabel = function (txt) {
            if (labelEl) labelEl.textContent = txt;
          };
          var finishFeedback = function () {
            setLabel("다운로드 완료");
            if (btn) btn.disabled = false;
            window.setTimeout(function () {
              setLabel("index.html 다운로드");
            }, 2000);
          };

          if (btn) btn.disabled = true;
          setLabel("준비 중...");

          if (
            typeof window.fetch === "function" &&
            window.location &&
            window.location.protocol !== "file:"
          ) {
            window
              .fetch("./index.html", { cache: "no-store" })
              .then(function (res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.text();
              })
              .then(function (txt) {
                if (txt && txt.indexOf("<!doctype html>") !== -1 && txt.indexOf("/@vite/client") === -1) {
                  triggerHtmlFileDownload(txt);
                  finishFeedback();
                } else if (CLEAN_SOURCE_SNAPSHOT) {
                  triggerHtmlFileDownload(CLEAN_SOURCE_SNAPSHOT);
                  finishFeedback();
                }
              })
              .catch(function () {
                if (CLEAN_SOURCE_SNAPSHOT) {
                  triggerHtmlFileDownload(CLEAN_SOURCE_SNAPSHOT);
                }
                finishFeedback();
              });
            return;
          }

          if (CLEAN_SOURCE_SNAPSHOT) {
            triggerHtmlFileDownload(CLEAN_SOURCE_SNAPSHOT);
          }
          finishFeedback();
        }

        document.getElementById("brand-reset-btn").onclick = resetAll;
        document.getElementById("header-reset-btn").onclick = resetAll;
        document.getElementById("header-download-btn").onclick = downloadStandaloneHtml;

        var navBtns = document.querySelectorAll("#desktop-nav .nav-step-btn");
        for (var i = 0; i < navBtns.length; i++) {
          navBtns[i].onclick = function () {
            if (this.disabled) return;
            var target = this.getAttribute("data-step");
            if (target !== "interview") {
              stopSpeaking();
              stopListening();
              stopTimer();
            }
            state.step = target;
            render();
          };
        }

        render();
      })();
    </script></body></html>
